name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: env_prod
    concurrency:
      group: deploy-testtask-collector
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t testtask-collector:${{ github.sha }} -t testtask-collector:latest .

      - name: Stop old container
        run: docker stop testtask-collector || true && docker rm testtask-collector || true

      - name: Verify required secrets are present
        run: |
          test -n "${{ secrets.ADMIN_PASSWORD }}" || { echo "::error::ADMIN_PASSWORD is empty — check env_prod secrets"; exit 1; }
          test -n "${{ secrets.ADMIN_SECRET }}" || { echo "::error::ADMIN_SECRET is empty — check env_prod secrets"; exit 1; }

      - name: Run new container
        run: |
          docker run -d \
            -p 3000:3000 \
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -e ADMIN_SECRET="${{ secrets.ADMIN_SECRET }}" \
            -e NEXT_PUBLIC_BASE_URL="${{ secrets.NEXT_PUBLIC_BASE_URL }}" \
            -e DATABASE_URL="file:./prisma/data/dev.db" \
            -v testtask-db:/app/prisma/data \
            -v testtask-uploads-submissions:/app/uploads/submissions \
            -v testtask-uploads-admin:/app/uploads/admin \
            -v testtask-uploads-captures:/app/uploads/captures \
            --restart unless-stopped \
            --name testtask-collector \
            testtask-collector:${{ github.sha }}

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/admin >/dev/null; then
              echo "up"; exit 0
            fi
            sleep 2
          done
          echo "container did not come up, dumping logs"
          docker logs testtask-collector
          exit 1

      - name: Prune old images
        run: docker image prune -a -f
