<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/32.png" alt="" width="20" height="20" />
    <span>Скриншоты с метками</span>
  </header>

  <section id="view-main">
    <button id="capture-btn" class="primary">Сделать скриншот</button>
    <p class="muted small">Или сочетание клавиш <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>.
      Всё работает в браузере: скриншот можно скопировать в буфер обмена, ничего не отправляется в интернет.</p>

    <details id="server-box">
      <summary>Сохранять на свой сервер (необязательно)</summary>
      <form id="view-login">
        <p class="hint" id="login-hint">Нужен собственный сервер этого сервиса (инструкция в README репозитория).</p>
        <label>Адрес сервиса
          <input id="server" type="url" required placeholder="https://your-server.example" />
        </label>
        <label>Логин
          <input id="login" autocomplete="username" required />
        </label>
        <label>Пароль
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" id="login-btn" class="primary">Войти</button>
      </form>
      <div id="view-account" hidden>
        <p class="who">Вы вошли как <b id="who"></b></p>
        <button id="logout-btn" class="link">Выйти</button>
      </div>
    </details>
  </section>

  <p id="error" class="error" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
